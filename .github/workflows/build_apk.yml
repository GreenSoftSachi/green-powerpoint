name: Build Green PowerPoint v1 (APK and AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Web App & Compile Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Build Green PowerPoint Web Core (Vite)
      run: |
        cd web
        npm install --ignore-scripts --legacy-peer-deps
        npm run build-only
        cd ..
        ls -la web/dist/

    - name: Deploy Fresh Web Assets to Android
      run: |
        mkdir -p android/app/src/main/assets/www
        # Remove old static files while preserving fonts and developer avatar
        find android/app/src/main/assets/www -mindepth 1 ! -name 'fonts' ! -name 'sachinthaka_photo.jpg' -exec rm -rf {} +
        # Copy fresh web dist
        cp -r web/dist/* android/app/src/main/assets/www/
        ls -la android/app/src/main/assets/www/

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      working-directory: android
      run: chmod +x gradlew

    - name: Build Release APK and Play Store Bundle (AAB)
      working-directory: android
      run: |
        ./gradlew assembleRelease bundleRelease --no-daemon

    - name: Prepare Artifacts
      run: |
        mkdir -p dist/android
        cp android/app/build/outputs/apk/release/*.apk dist/android/Green-PowerPoint-v1.apk
        cp android/app/build/outputs/bundle/release/*.aab dist/android/Green-PowerPoint-v1.aab
        ls -la dist/android/

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Green-PowerPoint-v1-APK
        path: dist/android/Green-PowerPoint-v1.apk
        retention-days: 30

    - name: Upload Play Store AAB Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Green-PowerPoint-v1-AAB
        path: dist/android/Green-PowerPoint-v1.aab
        retention-days: 30

    - name: Create Public GitHub Release v1
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1
        name: Green PowerPoint v1.0.0
        body: |
          ### Green PowerPoint v1.0.0 Android Release
          - **Office 365 Ribbon UI**: Tabs for File, Home, Insert, Draw, Design, Transitions, Animation, View
          - **Full Microsoft PowerPoint Compatibility**: Native PPTX Import & Export, Slideshow presenter mode, Animations & Transitions
          - **Offline Ready**: Instant loading with local IndexedDB storage
          - **Developer**: Sachinthaka Sandaruwan (Green Soft Technologies)
          - **Architecture**: Vue 3 + Vite bundled into high-performance Native Android WebView
        files: |
          dist/android/Green-PowerPoint-v1.apk
          dist/android/Green-PowerPoint-v1.aab
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
