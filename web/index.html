<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="G-PowerPoint - Modern Presentation Editor for Android & Web by Green Soft Technologies" />
    <meta name="keywords" content="G-PowerPoint, PowerPoint, Presentation, Slides, Green Soft" />
    <title>G-PowerPoint - Presentation Editor</title>

    <style>
      .first-screen-loading {
        width: 220px;
        height: 220px;
        position: fixed;
        top: 50%;
        left: 50%;
        margin-top: -110px;
        margin-left: -110px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', -apple-system, sans-serif;
      }
      .first-screen-loading-spinner {
        width: 40px;
        height: 40px;
        border: 3.5px solid #D83B01;
        border-top-color: transparent;
        border-radius: 50%;
        box-sizing: border-box;
        animation: spinner .8s linear infinite;
      }
      .first-screen-loading-text {
        margin-top: 18px;
        color: #D83B01;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.3px;
      }
      @keyframes spinner {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="first-screen-loading">
        <div class="first-screen-loading-spinner"></div>
        <div class="first-screen-loading-text">Loading G-PowerPoint ...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>

  <script>
    document.oncontextmenu = e => e.preventDefault()
  </script>
</html>
